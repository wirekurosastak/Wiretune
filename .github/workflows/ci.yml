name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: 3.47.6

jobs:
  test:
    name: Analyse and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      # ffmpeg encodes the tag-reader fixtures; without it those tests are skipped.
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Formatting
        run: dart format --output none --set-exit-if-changed packages server app/lib app/test
      - name: Core
        working-directory: packages/wiretune_core
        run: dart pub get && dart analyze --fatal-infos && dart test
      - name: Server
        working-directory: server
        run: dart pub get && dart analyze --fatal-infos && dart test
      - name: App
        working-directory: app
        run: flutter pub get && flutter analyze --fatal-infos && flutter test

  server:
    name: Server executable (${{ matrix.os }})
    needs: test
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - working-directory: server
        run: dart pub get && dart build cli -o build
      - uses: actions/upload-artifact@v4
        with:
          name: wiretune-server-${{ runner.os }}
          path: server/build/bundle

  android:
    name: Android APK
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      # Signed with the debug key: there is no key.properties in CI.
      - working-directory: app
        run: flutter build apk --release --split-per-abi
      - uses: actions/upload-artifact@v4
        with:
          name: wiretune-android
          path: app/build/app/outputs/flutter-apk/*.apk

  desktop:
    name: Player (${{ matrix.target }})
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux
            os: ubuntu-latest
          - target: windows
            os: windows-latest
          - target: macos
            os: macos-latest
          - target: ios
            os: macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - if: matrix.target == 'linux'
        run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libmpv-dev
      - if: matrix.target != 'ios'
        working-directory: app
        run: flutter build ${{ matrix.target }} --release
      # Not signed: this only checks that the iOS app builds.
      - if: matrix.target == 'ios'
        working-directory: app
        run: flutter build ios --release --no-codesign
