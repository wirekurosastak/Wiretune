name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Actions → CI → Run workflow, on any branch: its iPhone app to sideload, for one.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Also in test.yml, in release.yml (with the Dart it brings, DART_VERSION) and as server/Dockerfile's DART_VERSION
  # default.
  FLUTTER_VERSION: 3.47.6

jobs:
  test:
    name: Analyse and test
    uses: ./.github/workflows/test.yml

  server:
    name: Server executable (${{ matrix.os }})
    needs: test
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: dart tool/build.dart server
      - uses: actions/upload-artifact@v4
        with:
          name: wiretune-server-${{ runner.os }}
          path: dist/server

  docker:
    name: Server image
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f server/Dockerfile -t wiretune-server .
      # Starts the image on an empty library and asks the one anonymous route that needs no account.
      - name: Start and ask
        run: |
          mkdir music
          docker run -d --name wiretune -p 5200:5200 -v "$PWD/music:/music:ro" wiretune-server
          for _ in $(seq 30); do
            curl -fsS http://127.0.0.1:5200/api/auth/setup-required && exit 0
            sleep 1
          done
          docker logs wiretune
          exit 1
      # The image that converts music: ffmpeg is in it and has the two encoders.
      - name: Image with ffmpeg
        run: |
          docker build -f server/Dockerfile --build-arg WITH_FFMPEG=true -t wiretune-server:ffmpeg .
          docker run --rm --entrypoint ffmpeg wiretune-server:ffmpeg -hide_banner -encoders | grep -E 'libopus|libmp3lame'
          docker run --rm --entrypoint sh wiretune-server "-c" 'command -v ffmpeg' && exit 1 || true

  android:
    name: Android APK
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      # Signed with the debug key: there is no key.properties in CI.
      - run: dart tool/build.dart android
      - uses: actions/upload-artifact@v4
        with:
          name: wiretune-android
          path: dist/android/*.apk

  desktop:
    name: Player (${{ matrix.target }})
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-deb linux-rpm
            os: ubuntu-latest
          - target: windows
            os: windows-latest
          - target: macos
            os: macos-latest
          - target: ios
            os: macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libmpv-dev rpm
      - if: matrix.target != 'ios'
        run: dart tool/build.dart ${{ matrix.target }}
      # Unsigned (a signed .ipa, tool/build.dart ios, needs a signing team): to sign with an Apple ID while sideloading
      # it (docs/building.md).
      - if: matrix.target == 'ios'
        working-directory: app
        run: |
          flutter build ios --release --no-codesign
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qr wiretune-unsigned.ipa Payload
      - if: matrix.target == 'ios'
        uses: actions/upload-artifact@v4
        with:
          name: wiretune-ios-unsigned
          path: app/wiretune-unsigned.ipa
