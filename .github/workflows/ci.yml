name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Also in release.yml (with the Dart it brings, DART_VERSION) and as server/Dockerfile's DART_VERSION default.
  FLUTTER_VERSION: 3.47.6

jobs:
  test:
    name: Analyse and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      # ffmpeg encodes the tag-reader fixtures; without it those tests are skipped.
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Dependencies
        run: |
          (cd packages/wiretune_core && dart pub get)
          (cd packages/wiretune_platform && flutter pub get)
          (cd server && dart pub get)
          (cd app && flutter pub get)
      - name: Formatting
        run: dart format --output none --set-exit-if-changed packages server app/lib app/test tool
      - name: License headers
        run: |
          missing=$(git ls-files '*.dart' '*.kt' '*.cs' | xargs grep -L 'SPDX-License-Identifier: AGPL-3.0-only' || true)
          [ -z "$missing" ] || { echo "These files lack the license header (CONTRIBUTING.md):"; echo "$missing"; exit 1; }
      - name: Build script
        run: dart analyze --fatal-infos tool
      - name: Core
        working-directory: packages/wiretune_core
        run: dart analyze --fatal-infos && dart test
      - name: Server
        working-directory: server
        run: dart analyze --fatal-infos && dart test
      - name: App
        working-directory: app
        run: flutter analyze --fatal-infos && flutter test

  server:
    name: Server executable (${{ matrix.os }})
    needs: test
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: dart tool/build.dart server
      - uses: actions/upload-artifact@v4
        with:
          name: wiretune-server-${{ runner.os }}
          path: dist/server

  android:
    name: Android APK
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      # Signed with the debug key: there is no key.properties in CI.
      - run: dart tool/build.dart android
      - uses: actions/upload-artifact@v4
        with:
          name: wiretune-android
          path: dist/android/*.apk

  desktop:
    name: Player (${{ matrix.target }})
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux
            os: ubuntu-latest
          - target: windows
            os: windows-latest
          - target: macos
            os: macos-latest
          - target: ios
            os: macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - if: matrix.target == 'linux'
        run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libmpv-dev
      - if: matrix.target != 'ios'
        run: dart tool/build.dart ${{ matrix.target }}
      # Not signed: this only checks that the iOS app builds (an .ipa, tool/build.dart ios, needs a signing team).
      - if: matrix.target == 'ios'
        working-directory: app
        run: flutter build ios --release --no-codesign
