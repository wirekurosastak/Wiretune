name: wiretune_server
description: >-
  The Wiretune server: indexes one music folder and serves it to Wiretune players over HTTP, with accounts and
  per-account favourites, play counts and playlists.
publish_to: none
version: 1.0.2026+1

environment:
  sdk: ^3.10.0

dependencies:
  args: ^2.7.0
  bcrypt: ^1.2.0
  crypto: ^3.0.7
  path: ^1.9.1
  shelf: ^1.4.2
  wiretune_core:
    path: ../packages/wiretune_core

dev_dependencies:
  http: ^1.6.0
  lints: ^6.0.0
  test: ^1.26.0
