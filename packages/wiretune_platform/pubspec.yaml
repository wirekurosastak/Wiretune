name: wiretune_platform
description: Wiretune's own Android code, as a plugin so that it is registered on every Flutter engine of the app.
publish_to: none
version: 1.0.0

environment:
  sdk: ^3.10.0
  flutter: '>=3.3.0'

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.wiretune.platform
        pluginClass: WiretunePlatformPlugin
